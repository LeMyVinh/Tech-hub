<div class="credit-card-payment">
  @if (loading()) {
    <div class="loading-box">
      <div class="spinner"></div>
      <p>Đang khởi tạo thanh toán...</p>
    </div>
  }

  <div id="payment-element" [class.hidden]="loading()"></div>

  @if (error()) {
    <div class="feedback error">{{ error() }}</div>
  }

  <button class="btn-submit" [disabled]="submitting() || loading()" (click)="pay()">
    <span class="material-icons">{{ submitting() ? 'hourglass_empty' : 'credit_card' }}</span>
    {{ submitting() ? 'Đang xử lý...' : 'Xác nhận thanh toán' }}
  </button>
</div>
