<div class="credit-card-payment">
  @if (loading()) {
    <div class="loading-box">
      <div class="spinner"></div>
      <p>Đang khởi tạo thanh toán...</p>
    </div>
  }

  <div id="payment-element"></div>

  @if (error()) {
    <div class="feedback error">{{ error() }}</div>
  }

  @if (!loading() && !ready() && !error()) {
    <p class="hint">Đang tải form thẻ...</p>
  }

  <button
    class="btn-submit"
    [disabled]="submitting() || loading() || !ready()"
    (click)="pay()">
    {{ submitting() ? 'Đang xử lý...' : 'Xác nhận thanh toán' }}
  </button>
</div>
