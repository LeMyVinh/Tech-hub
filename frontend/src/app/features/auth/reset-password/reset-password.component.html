<div class="auth-wrapper">
  <section class="auth-card">
    <div class="heading">
      <h2>Đặt lại mật khẩu</h2>
      <p>Nhập mật khẩu mới cho tài khoản.</p>
    </div>

    @if (error()) {
      <div class="feedback error">{{ error() }}</div>
    }
    @if (message()) {
      <div class="feedback success">{{ message() }}</div>
    }

    <form (ngSubmit)="submit()">
      <label>Mật khẩu mới<input type="password" name="newPassword" [(ngModel)]="newPassword" required minlength="6" /></label>
      <label>Xác nhận mật khẩu<input type="password" name="confirmPassword" [(ngModel)]="confirmPassword" required /></label>
      <button class="primary-button" type="submit" [disabled]="loading()">Đặt lại mật khẩu</button>
    </form>
  </section>
</div>
