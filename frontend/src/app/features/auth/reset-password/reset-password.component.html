<div class="auth-wrapper">
  <section class="auth-card">
    <div class="heading">
      <h2>Đặt lại mật khẩu</h2>
      <p>Nhập mật khẩu mới cho tài khoản.</p>
    </div>

    @if (error()) {
      <div class="feedback error">{{ error() }}</div>
    }
    @if (message()) {
      <div class="feedback success">{{ message() }}</div>
    }

    <form (ngSubmit)="submit()" #resetForm="ngForm" novalidate>
      <label>
        Mật khẩu mới
        <input
          type="password"
          name="newPassword"
          [(ngModel)]="newPassword"
          required
          minlength="6"
          [maxlength]="passwordMaxLength"
          [pattern]="passwordPattern"
          #newPasswordCtrl="ngModel"
          [class.invalid]="newPasswordCtrl.invalid && newPasswordCtrl.touched"
        />
        @if (newPasswordCtrl.invalid && newPasswordCtrl.touched) {
          <span class="field-error">Mật khẩu tối thiểu 6 ký tự, có ít nhất 1 chữ hoa và 1 chữ số.</span>
        }
      </label>
      <label>
        Xác nhận mật khẩu
        <input
          type="password"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          required
          #confirmPasswordCtrl="ngModel"
          [class.invalid]="confirmPasswordCtrl.touched && confirmPassword !== newPassword"
        />
        @if (confirmPasswordCtrl.touched && confirmPassword !== newPassword) {
          <span class="field-error">Xác nhận mật khẩu chưa khớp.</span>
        }
      </label>
      <button
        class="primary-button"
        type="submit"
        [disabled]="loading() || resetForm.invalid || newPassword !== confirmPassword"
      >
        {{ loading() ? 'Đang xử lý...' : 'Đặt lại mật khẩu' }}
      </button>
    </form>
  </section>
</div>
