<div class="auth-wrapper">
  <section class="auth-card">
    <a class="back-button" routerLink="/auth/login">← Quay lại đăng nhập</a>

    <div class="heading">
      <h2>Quên mật khẩu?</h2>
      <p>Chúng tôi sẽ gửi liên kết đến email của bạn.</p>
    </div>

    @if (error()) {
      <div class="feedback error">{{ error() }}</div>
    }
    @if (message()) {
      <div class="feedback success">{{ message() }}</div>
    }

    <form (ngSubmit)="submit()">
      <label>Email<input type="email" name="email" [(ngModel)]="email" required /></label>
      <button class="primary-button" type="submit" [disabled]="loading()">Gửi liên kết</button>
    </form>
  </section>
</div>
